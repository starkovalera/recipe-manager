services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: recipe_manager
      POSTGRES_PASSWORD: recipe_manager
      POSTGRES_DB: recipe_manager_dev
    ports:
      - "5432:5432"
    volumes:
      - recipe_manager_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recipe_manager -d recipe_manager_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - recipe_manager_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:4
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

  localstack:
    profiles: ["local-s3"]
    image: localstack/localstack:4.14.0
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      S3_SKIP_SIGNATURE_VALIDATION: "0"
      S3_USER_MEDIA_BUCKET_NAME: recipe-manager-local-user-media
      S3_SYSTEM_ARTIFACTS_BUCKET_NAME: recipe-manager-local-system-artifacts
    volumes:
      - ./docker/localstack/init/01-create-s3-buckets.sh:/etc/localstack/init/ready.d/01-create-s3-buckets.sh:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  krakend:
    build:
      context: ./infra/krakend
    ports:
      - "127.0.0.1:8081:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      FC_ENABLE: "1"
      FC_SETTINGS: /etc/krakend/config
      FC_OUT: /tmp/krakend.generated.json
      CLERK_ISSUER: ${CLERK_ISSUER:-}
      CLERK_JWKS_URL: ${CLERK_JWKS_URL:-}

volumes:
  recipe_manager_pgdata:
  recipe_manager_redisdata:
